syntax = "proto3";

package kraal.v1;

option go_package = "github.com/radicelle/kraal/pkg/protocol/v1;protocolv1";

// ConnectorService defines the invariant contract for all Kraal lineage & metadata connectors.
service ConnectorService {
  // Spec returns connector metadata and required configuration schema.
  rpc Spec(SpecRequest) returns (SpecResponse);

  // Check verifies connectivity to the external target with provided configuration.
  rpc Check(CheckRequest) returns (CheckResponse);

  // Discover inspects the external target and returns schemas, entities, and lineage relationships.
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);

  // Read extracts metadata and lineage records and streams them to the caller.
  rpc Read(ReadRequest) returns (stream RecordEnvelope);

  // Write ingests metadata/lineage tags into the target when operating as a sink.
  rpc Write(stream RecordEnvelope) returns (WriteResponse);
}

message SpecRequest {}

message SpecResponse {
  string name = 1;
  string version = 2;
  string description = 3;
  string config_schema_json = 4; // JSON Schema describing expected config fields
}

message CheckRequest {
  string config_json = 1;
}

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_SUCCESS = 1;
  CHECK_STATUS_FAILED = 2;
}

message CheckResponse {
  CheckStatus status = 1;
  string message = 2;
}

message DiscoverRequest {
  string config_json = 1;
}

// RelationEdge models a directional dependency/lineage edge between entities or fields.
// e.g. Foreign Keys in databases, or Associations in HubSpot CRM (Deal -> Contact).
message RelationEdge {
  string source_entity = 1; // e.g. "public.orders" or "deals"
  string source_field = 2;  // e.g. "customer_id" or "associated_contact_id"
  string target_entity = 3; // e.g. "public.customers" or "contacts"
  string target_field = 4;  // e.g. "id" or "hs_object_id"
  string relation_type = 5; // e.g. "FOREIGN_KEY", "ASSOCIATION", "VIEW_DEPENDENCY"
  string description = 6;
}

// FieldMetadata represents structured attribute/column metadata of an entity.
message FieldMetadata {
  string name = 1;
  string data_type = 2;
  string native_type = 3;
  bool is_primary_key = 4;
  bool is_nullable = 5;
  string description = 6;
}

message StreamSchema {
  string name = 1;                          // Entity/table/object name (e.g. "public.users", "contacts")
  repeated string primary_keys = 2;         // Primary key or unique identifier field names
  string json_schema = 3;                   // JSON Schema representation of the entity
  repeated string supported_sync_modes = 4; // e.g. ["METADATA", "LINEAGE"]
  repeated FieldMetadata fields = 5;        // Structured field/column definitions
  repeated RelationEdge relations = 6;      // Outgoing lineage edges from this entity
  string entity_type = 7;                   // e.g. "TABLE", "VIEW", "CRM_OBJECT", "CUSTOM_OBJECT"
  string description = 8;
}

message DiscoverResponse {
  repeated StreamSchema streams = 1;
  repeated RelationEdge relations = 2;      // Cross-entity lineage relationships
}

message ReadRequest {
  string config_json = 1;
  string stream_name = 2;
  string cursor_field = 3;
  string cursor_value = 4; // Starting cursor for incremental sync
  int64 limit = 5;         // Optional row limit (0 = no limit)
}

message RecordEnvelope {
  string stream = 1;
  int64 sequence_number = 2;
  string emitted_at = 3;    // RFC3339 timestamp
  bytes data_json = 4;      // Metadata payload encoded as JSON
  string cursor = 5;        // Cursor value for state tracking
  string record_type = 6;   // "ENTITY", "RELATION", "METADATA"
}

message WriteResponse {
  int64 records_written = 1;
  int64 records_failed = 2;
  string message = 3;
}
